name: Validate
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: petition_eu
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: API integration
        run: |
          node dist/server.js > /tmp/reunite-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:integration

      - name: Regional storage integration
        env:
          DATABASE_URL_EU: postgresql://postgres:localtest@127.0.0.1:5432/petition_eu
          DATABASE_URL_US: postgresql://postgres:localtest@127.0.0.1:5432/petition_us
          WEBSITE_SITE_NAME: local-ingress-test
          PORT: 3329
        run: |
          psql "$DATABASE_URL_EU" -c 'CREATE DATABASE petition_us'
          psql "$DATABASE_URL_EU" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE rn_runtime;
          CREATE ROLE rn_reader;
          CREATE ROLE runtime_test LOGIN PASSWORD 'localtest' IN ROLE rn_runtime;
          CREATE ROLE reader_test LOGIN PASSWORD 'localtest' IN ROLE rn_reader;
          SQL
          node dist/migrate.js --grant-app-roles
          owner_eu=$DATABASE_URL_EU
          owner_us=$DATABASE_URL_US
          export DATABASE_READER_URL_EU=${owner_eu/postgres:localtest/reader_test:localtest}
          export DATABASE_READER_URL_US=${owner_us/postgres:localtest/reader_test:localtest}
          export DATABASE_URL_EU=${owner_eu/postgres:localtest/runtime_test:localtest}
          export DATABASE_URL_US=${owner_us/postgres:localtest/runtime_test:localtest}
          node dist/server.js > /tmp/reunite-regional.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3329/api/health > /dev/null; then break; fi
            sleep 1
          done
          npx tsx --test tests/db-roles.test.ts
          TEST_API_URL=http://127.0.0.1:3329 npm run test:integration
          DATABASE_URL_EU="$owner_eu" DATABASE_URL_US="$owner_us" npx tsx --test tests/regions.test.ts
